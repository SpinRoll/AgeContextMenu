name: Build AgeContextMenu (Windows x64)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble source archive
        shell: pwsh
        run: |
          $parts = @(
            "source/archive.part00",
            "source/archive.part01",
            "source/archive.part02",
            "source/archive.part03",
            "source/archive.part04",
            "source/archive.part05",
            "source/archive.part06",
            "source/archive.part07"
          )
          $encoded = ""
          foreach ($part in $parts) {
            if (!(Test-Path $part)) { throw "Missing source archive segment: $part" }
            $encoded += (Get-Content $part -Raw).Trim()
          }
          $bytes = [Convert]::FromBase64String($encoded)
          [IO.File]::WriteAllBytes("$PWD\source\AgeContextMenu-source.zip", $bytes)
          Expand-Archive -Path "$PWD\source\AgeContextMenu-source.zip" -DestinationPath "$PWD\_build" -Force
          if (!(Test-Path "$PWD\_build\AgeContextMenu\AgeContextMenu\AgeContextMenu.csproj")) {
            throw "The source archive could not be reconstructed or has an unexpected folder layout."
          }

          # .NET 5+ must not consume the legacy Windows SDK Contracts WinMD package.
          $project = "$PWD\_build\AgeContextMenu\AgeContextMenu\AgeContextMenu.csproj"
          [xml]$xml = Get-Content $project
          $legacy = $xml.Project.ItemGroup.PackageReference | Where-Object { $_.Include -eq "Microsoft.Windows.SDK.Contracts" }
          if ($legacy) {
            $legacy.ParentNode.RemoveChild($legacy) | Out-Null
            $xml.Save($project)
          }
          if (Select-String -Path $project -Pattern "Microsoft.Windows.SDK.Contracts" -Quiet) {
            throw "Legacy Microsoft.Windows.SDK.Contracts reference was not removed."
          }
          Set-Content -Path "$PWD\global.json" -Value '{ "sdk": { "version": "8.0.428", "rollForward": "latestPatch" } }' -Encoding utf8
          # The unpacked source omits System.IO imports used by the services.
          Set-Content -Path "$PWD\_build\AgeContextMenu\AgeContextMenu\GlobalUsings.Build.cs" -Value "global using System.IO;" -Encoding utf8
          # Fix the bridge resource's logical name: the original project misspelled this MSBuild metadata.
          $projectDir = "$PWD\_build\AgeContextMenu\AgeContextMenu"
          $project = "$projectDir\AgeContextMenu.csproj"
          [xml]$projectXml = Get-Content $project
          $bridgeResource = $projectXml.Project.ItemGroup.EmbeddedResource | Where-Object { $_.Include -like "*agebridge.exe" }
          if (!$bridgeResource) { throw "Embedded agebridge.exe resource declaration not found." }
          $bridgeResource.RemoveAttribute("LoganilName")
          $bridgeResource.SetAttribute("LogicalName", "AgeContextMenu.agebridge.exe")
          $mainGroup = $projectXml.Project.PropertyGroup | Select-Object -First 1
          $appIcon = $projectXml.CreateElement("ApplicationIcon")
          $appIcon.InnerText = "Assets\AgeContextMenu.ico"
          [void]$mainGroup.AppendChild($appIcon)
          $projectXml.Save($project)

          # Generate a native Windows .ico on the Windows runner (folder + clock motif).
          Add-Type -AssemblyName System.Drawing
          $assets = "$projectDir\Assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $bmp = New-Object System.Drawing.Bitmap(256, 256)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::Transparent)
          $tile = New-Object System.Drawing.Drawing2D.GraphicsPath
          $tile.AddArc(4,4,56,56,180,90); $tile.AddArc(196,4,56,56,270,90)
          $tile.AddArc(196,196,56,56,0,90); $tile.AddArc(4,196,56,56,90,90)
          $tile.CloseFigure()
          $bg = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255,8,27,58))
          $g.FillPath($bg,$tile)
          $folderPath = New-Object System.Drawing.Drawing2D.GraphicsPath
          $folderPath.AddPolygon([System.Drawing.Point[]]@(
            (New-Object System.Drawing.Point(42,83)),(New-Object System.Drawing.Point(42,66)),
            (New-Object System.Drawing.Point(111,66)),(New-Object System.Drawing.Point(130,85)),
            (New-Object System.Drawing.Point(211,85)),(New-Object System.Drawing.Point(211,190)),
            (New-Object System.Drawing.Point(42,190))
          ))
          $folderBrush = New-Object System.Drawing.Drawing2D.LinearGradientBrush(
            (New-Object System.Drawing.Rectangle(42,66,169,124)),
            [System.Drawing.Color]::FromArgb(255,41,226,245),
            [System.Drawing.Color]::FromArgb(255,0,93,220), 45)
          $g.FillPath($folderBrush,$folderPath)
          $g.DrawPath((New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255,120,245,255),4)),$folderPath)
          $silver = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255,195,218,245))
          $navy = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255,9,31,67))
          $g.FillEllipse($silver,132,127,100,100)
          $g.FillEllipse($navy,140,135,84,84)
          $whitePen = New-Object System.Drawing.Pen([System.Drawing.Color]::White,5)
          $g.DrawLine($whitePen,182,146,182,157); $g.DrawLine($whitePen,182,197,182,208)
          $g.DrawLine($whitePen,150,177,160,177); $g.DrawLine($whitePen,204,177,214,177)
          $goldPen = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255,255,177,35),8)
          $goldPen.StartCap = [System.Drawing.Drawing2D.LineCap]::Round
          $goldPen.EndCap = [System.Drawing.Drawing2D.LineCap]::Round
          $g.DrawLine($goldPen,182,177,204,153)
          $g.FillEllipse((New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255,255,177,35))),176,171,12,12)
          $hIcon = $bmp.GetHicon()
          $nativeIcon = [System.Drawing.Icon]::FromHandle($hIcon)
          $iconStream = [System.IO.File]::Create("$assets\AgeContextMenu.ico")
          $nativeIcon.Save($iconStream)
          $iconStream.Dispose()
          $nativeIcon.Dispose(); $g.Dispose(); $bmp.Dispose()
          if (!(Test-Path "$assets\AgeContextMenu.ico")) { throw "Application icon generation failed." }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build age bridge
        shell: pwsh
        working-directory: _build/AgeContextMenu/AgeBridge
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          New-Item -ItemType Directory -Force -Path "../AgeContextMenu/Assets" | Out-Null
          go mod tidy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o "../AgeContextMenu/Assets/agebridge.exe" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore .NET dependencies
        run: dotnet restore _build/AgeContextMenu/AgeContextMenu/AgeContextMenu.csproj

      - name: Inspect project Windows references
        shell: pwsh
        run: |
          $project = "_build/AgeContextMenu/AgeContextMenu/AgeContextMenu.csproj"
          Write-Host "----- PROJECT FILE -----"
          Get-Content $project
          Write-Host "----- SDK AND WINDOWS REFERENCES -----"
          Select-String -Path $project -Pattern "TargetFramework|Windows|winmd|Reference|PackageReference|UseWinUI|UseWPF|UseWindowsForms"
          Write-Host "----- SDK VERSION -----"
          dotnet --version

      - name: Publish self-contained Windows x64 EXE
        shell: pwsh
        run: |
          dotnet publish _build/AgeContextMenu/AgeContextMenu/AgeContextMenu.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:TargetPlatformVersion=10.0.26100.0 `
            -p:TargetPlatformMinVersion=10.0.22000.0 `
            -o Dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgeContextMenu-windows-x64
          path: Dist/AgeContextMenu.exe
          if-no-files-found: error
          retention-days: 30
